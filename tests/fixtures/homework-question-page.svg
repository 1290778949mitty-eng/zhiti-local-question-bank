<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#d8d8d8"/>
  <rect x="90" y="70" width="1020" height="1460" rx="6" fill="white" stroke="#222" stroke-width="6"/>
  <text x="600" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700">初中数学作业</text>
  <text x="150" y="250" font-family="Arial,sans-serif" font-size="32">1. 计算 2 + 3 = ______。</text>
  <line x1="145" y1="300" x2="1050" y2="300" stroke="#aaa" stroke-width="3"/>
  <text x="150" y="410" font-family="Arial,sans-serif" font-size="32">2. 解方程：x + 4 = 9。</text>
  <line x1="145" y1="470" x2="1050" y2="470" stroke="#aaa" stroke-width="3"/>
  <line x1="145" y1="540" x2="1050" y2="540" stroke="#aaa" stroke-width="3"/>
  <text x="150" y="680" font-family="Arial,sans-serif" font-size="32">3. 说明三角形内角和为何等于 180°。</text>
  <line x1="145" y1="750" x2="1050" y2="750" stroke="#aaa" stroke-width="3"/>
  <line x1="145" y1="830" x2="1050" y2="830" stroke="#aaa" stroke-width="3"/>
  <line x1="145" y1="910" x2="1050" y2="910" stroke="#aaa" stroke-width="3"/>
  <text x="150" y="1450" font-family="Arial,sans-serif" font-size="24" fill="#777">请写清步骤，保持卷面完整。</text>
</svg>
